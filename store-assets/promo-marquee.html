<!DOCTYPE html>
<html>
<head>

<link rel="stylesheet" href="shared.css">
<style>
  body { width: 1400px; height: 560px; font-family: Inter, sans-serif; }
  .copy { position: absolute; left: 72px; top: 50%; transform: translateY(-50%); width: 520px; }
  .copy img { width: 84px; height: 84px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); margin-bottom: 28px; }

  .copy p { margin: 20px 0 0; font-size: 21px; line-height: 1.4; color: rgba(255,255,255,0.72); }
  .shot {
    position: absolute; left: 600px; top: 70px; width: 760px; height: 614px;
    background: url("upload/screenshot-1-hero-en.png") -480px -186px / 1280px 800px no-repeat;
    border-radius: 12px 12px 0 0; box-shadow: 0 30px 80px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>
  <div class="copy">
    <img src="../icons/logo.svg" alt="">
    <h1>A clean <em>bug report</em> in one click</h1>
    <p>Structured Jira bug templates, inserted from the Chrome side panel.</p>
  </div>
  <div class="shot"></div>

</html>
